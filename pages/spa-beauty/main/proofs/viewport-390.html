<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Matrix Spa &amp; Beauty — 390px Review</title><style>*{box-sizing:border-box}html{overflow-anchor:none}body{overflow-anchor:none;margin:0;background:#dce0db;color:#123d40;font:13px Arial,sans-serif}.bar{position:sticky;top:0;z-index:20;padding:14px 22px;background:#fdfcf9;border-bottom:1px solid #c7d1c8;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar strong{font-size:14px}.bar small{display:block;color:#5d6b65;margin-top:5px;font-size:11px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button{font:12px Arial,sans-serif;border:1px solid #829c90;color:#123d40;background:white;padding:10px 14px;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#123d40;color:white}button:focus-visible{outline:3px solid #087776;outline-offset:2px}.stage{margin:24px auto;position:relative;overflow:hidden;box-shadow:0 10px 32px #1b362923}iframe{border:0;display:block;transform-origin:top left;background:#f7f1e8}.note{text-align:center;padding:14px 24px 26px;font-size:12px;line-height:1.7}.tools{display:flex;gap:8px;align-items:center}</style></head><body><div class="bar"><div><strong>Matrix · Spa &amp; Beauty</strong><small>Design proof · Review 2 · Not installed or published</small></div><div class="buttons"><button data-width="1440" aria-pressed="false">Desktop · 1440</button><button data-width="390" aria-pressed="true">Mobile · 390</button><button data-width="320" aria-pressed="false">Small mobile · 320</button><button id="faqs">Open all FAQs</button></div></div><div class="stage"><iframe scrolling="no" title="Entire redesigned Spa and Beauty page" src="full-page.html"></iframe></div><div class="note">Complete proposed page body. Existing navigation, genuine reviews, and footer are represented for context and remain native in Wix.<br>Service photographs are illustrative. This review does not change your live website.</div><script>const frame=document.querySelector('iframe'),stage=document.querySelector('.stage');let width=390,height=6000;function size(){const scale=Math.min(1,(innerWidth-32)/width);frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';stage.style.width=(width*scale)+'px';stage.style.height=(height*scale)+'px'}document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{width=+b.dataset.width;document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',x===b));size();window.scrollTo(0,0);requestAnimationFrame(()=>window.scrollTo(0,0))});document.querySelector('#faqs').onclick=()=>{const ds=frame.contentDocument.querySelectorAll('.matrix-spa-main details');const open=[...ds].some(d=>!d.open);ds.forEach(d=>d.open=open);document.querySelector('#faqs').textContent=open?'Close all FAQs':'Open all FAQs'};window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data.matrixProofHeight){height=e.data.matrixProofHeight;size()}if(typeof e.data.matrixProofScroll==='number'){const scale=stage.clientWidth/width;window.scrollTo({top:stage.offsetTop+e.data.matrixProofScroll*scale-document.querySelector('.bar').offsetHeight-16,behavior:'instant'})}});function syncHeight(){if(frame.contentDocument&&frame.contentDocument.body){height=Math.ceil(frame.contentDocument.body.getBoundingClientRect().height);size()}}frame.addEventListener('load',syncHeight);window.addEventListener('resize',size);size();if(frame.contentDocument&&frame.contentDocument.readyState==='complete')syncHeight();</script></body></html>
