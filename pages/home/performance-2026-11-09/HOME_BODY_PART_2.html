eyebrow\">BEFORE YOUR VISIT</p><h2>A few helpful<br>answers.</h2><p class=\"hm-copy\">Not sure where to begin? We’re happy to help you choose.</p><a class=\"hm-link\" href=\"sms:+12629399325\" target=\"_top\">Text Matrix about your appointment</a></div><div><details><summary>What services does Matrix Massage &amp; Bodywork offer?</summary><p>Matrix offers Japanese Head Spa, custom facials, red light therapy, infrared sauna, manual lymphatic drainage, Swedish, deep tissue and prenatal massage, cupping, waxing and dermaplaning in our Salem, WI studio.</p></details><details><summary>What is a spa day with purpose?</summary><p>It is our clinical luxury approach: every visit feels indulgent and relaxing, and every service is chosen with intention for how you want to look and feel, from scalp and skin to recovery and stress relief.</p></details><details><summary>Do you offer Japanese Head Spa near me?</summary><p>Yes. Our Japanese Head Spa rituals feature Matrix Precision Scalp Infusions™ that we craft in house, plus complimentary Zen Lounge time. Rituals start at $95.</p></details><details><summary>Do you have a new client facial offer?</summary><p>Yes. New guests can enjoy a 45-minute custom facial for $79, regularly $95.</p></details><details><summary>How do I book an appointment?</summary><p>Book online anytime through our Square booking page or text (262) 939-9325. We are happy to help you choose the right service.</p></details><details><summary>What is your cancellation policy?</summary><p>Your appointment time is reserved just for you, so we ask for at least 24 hours&#x27; notice to cancel or reschedule. Cancellations made within 24 hours of your appointment, for any reason, and no-shows are charged the full price of the service plus an automatic 20% gratuity.</p></details><details><summary>Do I need a card on file to book?</summary><p>Yes. To secure your appointment, complete our intake form and credit card authorization form when you book. If you have a Matrix gift card on file instead, its remaining balance is applied toward any late-cancellation fee.</p></details><details><summary>What areas do you serve?</summary><p>Our Salem studio at 24804 75th St welcomes guests from Salem Lakes, Paddock Lake, Bristol, Twin Lakes, Silver Lake, Kansasville, Union Grove, Burlington, Pleasant Prairie, Kenosha and Antioch, IL.</p></details><details><summary>Can I book a massage during pregnancy?</summary><p>Matrix offers prenatal massage. Explore the prenatal option on our massage services page, and let us know your stage of pregnancy and any concerns before booking so we can help you choose the right appointment.</p></details><details><summary>Do you offer facials for acne-prone skin and lash extensions?</summary><p>Yes. Our Custom Facial can be tailored for acne-prone or congested skin, as well as hydration, sensitivity and visible signs of aging. We also offer Classic, Hybrid and Volume lash extensions with full sets and maintenance fills. Explore the separate facial and lash pages for details.</p></details><details><summary>Can I buy a massage or spa gift card online?</summary><p>Yes. Purchase a Matrix eGift Card through Square and choose a dollar amount, personal message and delivery by text or email. Visit our Gift Cards page for ideas. Buying a gift card does not reserve an appointment.</p></details></div></div></section>\n<section class=\"hm-close hm-water\"><div class=\"hm-close-inner\"><p class=\"hm-eyebrow\">YOUR NEXT MOMENT STARTS HERE</p><h2>Make a little room<br>for yourself.</h2><p>Choose your treatment. Find a time.<br>We’ll take care of the welcome.</p><div class=\"hm-actions\"><a class=\"hm-button hm-light\" href=\"https://book.squareup.com/appointments/m9m6r64pq02ode/location/LGNQ4P8GPMSEQ/services\" target=\"_top\">Book a Salem Spa Appointment</a><a class=\"hm-button hm-outline\" href=\"#hm-services\">Choose Your Matrix Service</a></div></div></section>\n</div>";
